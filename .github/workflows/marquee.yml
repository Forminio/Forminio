name: Generate Custom Icon Marquee

on:
  schedule:
    - cron: "0 0 * * 0" # 每周日自动运行
  workflow_dispatch: # 允许你手动触发
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install GodProfile
        run: |
          pip install godprofile-mcp

      - name: Generate Custom Marquee SVG
        run: |
          cat << 'EOF' > generate.py
          from godprofile_mcp.core import icon_marquee

          # 在这里配置你想要滚动的技术栈名字
          icons = ["Java", "Spring", "Python", "Vue", "Docker", "MySQL", "Redis", "RabbitMQ", "Git", "Linux"]

          # 使用官方快速启动中确认的正确函数名 build_marquee
          svg_content = icon_marquee.build_marquee(
              icons=icons,
              theme="terminal-hacker" # 黑底绿字的终端主题
          )

          with open("custom-marquee.svg", "w", encoding="utf-8") as f:
              f.write(svg_content)
          EOF
          python generate.py

      - name: Commit and Push SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add custom-marquee.svg
          git commit -m "Auto-generate custom icon marquee" || exit 0
          git push
