name: Generate Custom Icon Marquee

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install GodProfile
        run: |
          pip install godprofile-mcp

      - name: Generate Custom Marquee SVG
        run: |
          cat << 'EOF' > generate.py
          import traceback
          from godprofile_mcp.core import icon_marquee

          icons = ["Java", "Spring", "Python", "Vue", "Docker", "MySQL", "Redis", "RabbitMQ", "Git", "Linux"]

          try:
              # 先尝试官方 quickstart 里的写法
              svg_content = icon_marquee.build_marquee(
                  icons=icons,
                  theme="terminal-hacker"
              )
          except AttributeError:
              # 如果 build_marquee 不存在，打印模块里所有可用属性，方便排查
              print("build_marquee not found. Available attributes in icon_marquee:")
              for attr in dir(icon_marquee):
                  if not attr.startswith("_"):
                      print(f"  - {attr}")
              traceback.print_exc()
              raise SystemExit(1)
          except Exception as e:
              print(f"Error calling build_marquee: {e}")
              traceback.print_exc()
              raise SystemExit(1)

          with open("custom-marquee.svg", "w", encoding="utf-8") as f:
              f.write(svg_content)
          print("custom-marquee.svg generated successfully.")
          EOF
          python generate.py

      - name: Commit and Push SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add custom-marquee.svg
          git commit -m "Auto-generate custom icon marquee" || exit 0
          git push
